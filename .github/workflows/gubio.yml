name: gubio application

on:
  push:
    branches:
      - gubio

permissions:
  id-token: write
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/juangubio/gubio-app
  IMAGE_TAG: 1.0.5

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v3
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: juangubio
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/juangubio/gubio-app:${{ env.IMAGE_TAG }}

      - name: Debug secrets
        run: |
          echo "HOST='${{ secrets.VPS_HOST }}'"
          echo "USER='${{ secrets.VPS_USER }}'"
          echo "PORT='${{ secrets.VPS_SSH_PORT }}'"

      - name: Test SSH port
        run: |
          nc -zv ${{ secrets.VPS_HOST }} ${{ secrets.VPS_SSH_PORT }} || echo "SSH PORT NOT OPEN"

      - name: SSH Connected OK?
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script: |
            echo "SSH OK"
            mkdir -p ~/gubio

      - name: Copy stack.yml to VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_SSH_PORT }}
          source: "stack.yml"
          target: "/home/${{ secrets.VPS_USER }}/gubio"

      - name: Deploy stack
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script: |
            cd ~/gubio

            docker login ghcr.io -u juangubio -p ${{ secrets.GHCR_PAT }}
            docker pull ghcr.io/juangubio/gubio-app:${{ env.IMAGE_TAG }}

            docker stack rm gubio || true
            sleep 20

            docker stack deploy --with-registry-auth -c stack.yml gubio
            docker service ls
